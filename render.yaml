# Render Blueprint — deploy from repo root (npm workspaces monorepo)
# Dashboard: New + → Blueprint → connect this repo
# Set secret env vars in Render after the service is created.

services:
  - type: web
    name: travel-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL_USER
        sync: false
      - key: BASE_URL
        sync: false
